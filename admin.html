<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EthioInvest - Admin Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #090d16; color: #f8fafc; padding: 14px; max-width: 720px; margin: 0 auto; min-height: 100vh; }

    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      background: #111827; border: 1px solid #1f2937; padding: 12px 14px;
      border-radius: 14px; margin-bottom: 12px; gap: 8px;
    }
    .admin-title { font-size: 1.05rem; font-weight: 800; color: #38bdf8; }
    .admin-sub { font-size: 0.72rem; color: #94a3b8; margin-top: 2px; }
    .header-right { display: flex; align-items: center; gap: 6px; }
    .lang-box { display: flex; background: #0b1120; border-radius: 8px; padding: 2px; border: 1px solid #334155; }
    .lang-btn { background: transparent; color: #94a3b8; border: none; padding: 5px 8px; font-size: 0.74rem; font-weight: 700; border-radius: 6px; cursor: pointer; }
    .lang-btn.active { background: #0284c7; color: #ffffff; }
    .sync-btn { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 6px 10px; border-radius: 8px; font-size: 0.76rem; font-weight: 700; cursor: pointer; }

    #admin-gate { background: #111827; border: 1px solid #1f2937; border-radius: 14px; padding: 20px; margin-top: 18px; }
    #admin-gate h2 { font-size: 1.05rem; color: #38bdf8; margin-bottom: 12px; text-align: center; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.8rem; color: #cbd5e1; margin-bottom: 5px; }
    .form-group input {
      width: 100%; padding: 9px 11px; border-radius: 8px; border: 1px solid #374155;
      background: #0b1120; color: #f8fafc; font-size: 0.88rem;
    }

    .btn-blue { background: #0284c7; color: #ffffff; border: none; padding: 9px 14px; border-radius: 8px; font-size: 0.84rem; font-weight: 700; cursor: pointer; }
    .btn-green { background: #16a34a; color: #ffffff; border: none; padding: 7px 11px; border-radius: 7px; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .btn-red { background: #dc2626; color: #ffffff; border: none; padding: 7px 11px; border-radius: 7px; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .btn-amber { background: #d97706; color: #ffffff; border: none; padding: 7px 11px; border-radius: 7px; font-size: 0.76rem; font-weight: 700; cursor: pointer; }
    .btn-dark-del { background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; padding: 7px 11px; border-radius: 7px; font-size: 0.76rem; font-weight: 700; cursor: pointer; }

    #admin-panel { display: none; }

    .announce-card {
      background: #111827; border: 1px solid #1f2937; border-radius: 14px;
      padding: 12px; margin-bottom: 12px;
    }
    .announce-card h3 { font-size: 0.88rem; color: #38bdf8; margin-bottom: 8px; }
    .announce-row { display: flex; gap: 8px; }
    .announce-row input {
      flex: 1; padding: 8px 10px; border-radius: 8px; border: 1px solid #374155;
      background: #0b1120; color: #ffffff; font-size: 0.84rem;
    }

    /* Horizontal 5 tabs: User | Deposit | Withdrawal | Investment | Referral */
    .horizontal-nav-row {
      display: flex;
      flex-direction: row;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 4px;
      margin-bottom: 12px;
      touch-action: pan-x;
    }
    .h-tab-btn {
      flex: 1 0 auto;
      min-width: 92px;
      background: #111827;
      color: #cbd5e1;
      border: 1px solid #1f2937;
      border-radius: 10px;
      padding: 10px 8px;
      font-size: 0.78rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      white-space: nowrap;
    }
    .h-tab-btn.active {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .h-tab-count {
      font-size: 0.7rem;
      padding: 1px 7px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.55);
      color: #fde047;
    }

    .section-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      touch-action: pan-y;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1f2937;
    }

    .record-card {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .record-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      flex-wrap: wrap;
    }
    .record-user {
      font-size: 0.92rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .record-amount {
      font-size: 0.9rem;
      font-weight: 800;
      color: #4ade80;
    }
    .record-details {
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 10px;
      word-break: break-word;
    }
    .record-details strong {
      color: #94a3b8;
    }

    .status-pill { padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; display: inline-block; }
    .status-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .status-approved { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-rejected { background: rgba(239, 68, 68, 0.2); color: #f87171; }

    /* Buttons wrap cleanly inside screen width - no horizontal swipe needed */
    .action-btns-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 7px;
    }
    .action-btns-grid.four-cols {
      grid-template-columns: repeat(4, 1fr);
    }
    @media (max-width: 460px) {
      .action-btns-grid.four-cols {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .adjust-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }
    .adjust-row input {
      flex: 1;
      min-width: 110px;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid #374155;
      background: #111827;
      color: #ffffff;
      font-size: 0.82rem;
    }

    #review-modal {
      display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85);
      z-index: 9999; align-items: center; justify-content: center; padding: 16px;
    }
    #review-modal.active { display: flex; }
    .modal-card {
      width: 100%; max-width: 440px; background: #111827; border: 1px solid #334155;
      border-radius: 14px; padding: 16px; max-height: 88vh; overflow-y: auto;
    }
    .modal-card h4 { color: #38bdf8; margin-bottom: 10px; font-size: 1rem; }
    .modal-img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 8px; background: #0b1120; border: 1px solid #1f2937; margin: 10px 0; }
    .empty-msg { font-size: 0.82rem; color: #94a3b8; text-align: center; padding: 16px 0; }
  </style>
</head>
<body>

  <div class="admin-header">
    <div>
      <div class="admin-title" data-i18n="adminTitle">EthioInvest Admin</div>
      <div class="admin-sub" data-i18n="adminSub">Live Backend • Tap Tab to View Full Info</div>
    </div>
    <div class="header-right">
      <button class="sync-btn" onclick="syncAllData()" data-i18n="syncBtn">↻ Sync</button>
      <div class="lang-box">
        <button class="lang-btn" id="btnAmAdmin" onclick="setAdminLanguage('am')">አማ</button>
        <button class="lang-btn active" id="btnEnAdmin" onclick="setAdminLanguage('en')">EN</button>
      </div>
    </div>
  </div>

  <div id="admin-gate">
    <h2 data-i18n="gateTitle">Admin Access</h2>
    <div class="form-group">
      <label data-i18n="pinLabel">Admin PIN / Passcode (Default: 1234)</label>
      <input type="password" id="adminPassInput" placeholder="1234" />
    </div>
    <button class="btn-blue" style="width: 100%;" onclick="unlockAdmin()" data-i18n="openPanelBtn">Open Admin Dashboard</button>
  </div>

  <div id="admin-panel">
    <div class="announce-card">
      <h3 data-i18n="announceHeader">Post Announcement to Users</h3>
      <div class="announce-row">
        <input type="text" id="announceInput" placeholder="Write message for users..." />
        <button class="btn-blue" onclick="postAnnouncement()" data-i18n="postBtn">Post</button>
      </div>
    </div>

    <!-- Horizontal tabs: User | Deposit | Withdrawal | Investment | Referral -->
    <div class="horizontal-nav-row" id="horizontalTabsRow">
      <button type="button" class="h-tab-btn active" id="htab-user" onclick="selectAdminTab('user')">
        <span>👤 User</span>
        <span class="h-tab-count" id="count-user">0</span>
      </button>
      <button type="button" class="h-tab-btn" id="htab-deposit" onclick="selectAdminTab('deposit')">
        <span>💳 Deposit</span>
        <span class="h-tab-count" id="count-deposit">0</span>
      </button>
      <button type="button" class="h-tab-btn" id="htab-withdrawal" onclick="selectAdminTab('withdrawal')">
        <span>💸 Withdrawal</span>
        <span class="h-tab-count" id="count-withdrawal">0</span>
      </button>
      <button type="button" class="h-tab-btn" id="htab-investment" onclick="selectAdminTab('investment')">
        <span>📦 Investment</span>
        <span class="h-tab-count" id="count-investment">0</span>
      </button>
      <button type="button" class="h-tab-btn" id="htab-referral" onclick="selectAdminTab('referral')">
        <span>👥 Referral</span>
        <span class="h-tab-count" id="count-referral">0</span>
      </button>
    </div>

    <div class="section-card">
      <div class="section-title" id="activeSectionTitle">👤 User</div>
      <div id="activeSectionContent"></div>
    </div>
  </div>

  <div id="review-modal">
    <div class="modal-card">
      <h4 data-i18n="reviewTitle">Full Activity Details</h4>
      <div id="reviewModalBody" style="font-size: 0.82rem; color: #cbd5e1; line-height: 1.55;"></div>
      <button class="btn-blue" style="width: 100%; margin-top: 12px;" onclick="closeReviewModal()" data-i18n="closeBtn">Close</button>
    </div>
  </div>

  <script>
    const API_BASE = "https://ethioinvest-lvsr.onrender.com";
    const ADMIN_PIN = "1234";
    let adminLang = "en";
    let activeAdminTab = "user";
    let latestAdminState = {
      users: {},
      requests: { deposits: [], withdrawals: [], referrals: [], packages: [] },
      announcements: []
    };

    async function apiRequest(path, options = {}) {
      const res = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        throw new Error(data.error || `Request failed (${res.status})`);
      }
      return data;
    }

    const i18n = {
      en: {
        adminTitle: "EthioInvest Admin", adminSub: "Live Backend • Tap Tab to View Full Info",
        syncBtn: "↻ Sync", gateTitle: "Admin Access", pinLabel: "Admin PIN / Passcode (Default: 1234)",
        openPanelBtn: "Open Admin Dashboard", announceHeader: "Post Announcement to Users",
        postBtn: "Post", addBtn: "+ Add Balance", deductBtn: "- Deduct Balance",
        reviewTitle: "Full Activity Details", closeBtn: "Close",
        emptyUser: "No registered users yet.",
        emptyDeposit: "No deposit requests yet.",
        emptyWithdrawal: "No withdrawal requests yet.",
        emptyInvestment: "No investment package requests yet.",
        emptyReferral: "No referral requests yet."
      },
      am: {
        adminTitle: "EthioInvest Admin", adminSub: "ቀጥታ Backend • ሙሉ መረጃ ለማየት ክፍሉን ይንኩ",
        syncBtn: "↻ አድስ", gateTitle: "አስተዳዳሪ መግቢያ (Admin Access)", pinLabel: "የአድሚን ፒን (Default: 1234)",
        openPanelBtn: "አድሚን ፓነል ክፈት", announceHeader: "ለተጠቃሚዎች ማስታወቂያ ላክ",
        postBtn: "ላክ", addBtn: "+ ሂሳብ ጨምር", deductBtn: "- ሂሳብ ቀንስ",
        reviewTitle: "ሙሉ የእንቅስቃሴ መረጃ", closeBtn: "ዝጋ",
        emptyUser: "እስካሁን የተመዘገበ ተጠቃሚ የለም።",
        emptyDeposit: "እስካሁን የተቀማጭ ገንዘብ (Deposit) ጥያቄ የለም።",
        emptyWithdrawal: "እስካሁን የገንዘብ ማውጫ (Withdrawal) ጥያቄ የለም።",
        emptyInvestment: "እስካሁን የኢንቨስትመንት ፓኬጅ ጥያቄ የለም።",
        emptyReferral: "እስካሁን የሪፈራል ጥያቄ የለም።"
      }
    };

    function setAdminLanguage(lang) {
      adminLang = lang;
      document.documentElement.lang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (i18n[lang][key]) el.innerText = i18n[lang][key];
      });
      document.getElementById("btnAmAdmin").classList.toggle("active", lang === "am");
      document.getElementById("btnEnAdmin").classList.toggle("active", lang === "en");
      if (document.getElementById("admin-panel").style.display === "block") renderAdminState(latestAdminState);
    }

    function unlockAdmin() {
      const pin = document.getElementById("adminPassInput").value.trim();
      if (pin !== ADMIN_PIN) {
        alert("Incorrect Admin PIN! Default PIN is 1234");
        return;
      }
      sessionStorage.setItem("ethio_admin_unlocked", "true");
      document.getElementById("admin-gate").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      syncAllData();
    }

    async function postAnnouncement() {
      const input = document.getElementById("announceInput");
      const msg = input.value.trim();
      if (!msg) return;
      try {
        await apiRequest("/api/admin/announcements", {
          method: "POST",
          body: JSON.stringify({ message: msg })
        });
        input.value = "";
        await syncAllData();
        alert(adminLang === "am" ? "ማስታወቂያው ተልኳል!" : "Announcement posted!");
      } catch (err) {
        alert(err.message);
      }
    }

    function selectAdminTab(tabName) {
      activeAdminTab = tabName;
      ["user", "deposit", "withdrawal", "investment", "referral"].forEach(t => {
        const btn = document.getElementById("htab-" + t);
        if (btn) btn.classList.toggle("active", t === tabName);
      });
      renderActiveSection(latestAdminState);
    }

    function renderBadge(status) {
      const st = status || "pending";
      const cls = st === "approved" ? "status-approved" : st === "rejected" ? "status-rejected" : "status-pending";
      return `<span class="status-pill ${cls}">${st}</span>`;
    }

    async function syncAllData() {
      try {
        const st = await apiRequest("/api/admin/state");
        latestAdminState = {
          users: st.users || {},
          requests: {
            deposits: (st.requests && st.requests.deposits) || [],
            withdrawals: (st.requests && st.requests.withdrawals) || [],
            referrals: (st.requests && st.requests.referrals) || [],
            packages: (st.requests && st.requests.packages) || []
          },
          announcements: st.announcements || []
        };
        renderAdminState(latestAdminState);
      } catch (err) {}
    }

    function renderAdminState(st) {
      const users = st.users || {};
      const reqs = st.requests || {};
      document.getElementById("count-user").innerText = Object.keys(users).length;
      document.getElementById("count-deposit").innerText = (reqs.deposits || []).length;
      document.getElementById("count-withdrawal").innerText = (reqs.withdrawals || []).length;
      document.getElementById("count-investment").innerText = (reqs.packages || []).length;
      document.getElementById("count-referral").innerText = (reqs.referrals || []).length;
      renderActiveSection(st);
    }

    function renderActiveSection(st) {
      const users = st.users || {};
      const reqs = st.requests || {};
      const titleEl = document.getElementById("activeSectionTitle");
      const contentEl = document.getElementById("activeSectionContent");

      if (activeAdminTab === "user") {
        titleEl.innerText = "👤 User — Registered Users & Full Info";
        const usernames = Object.keys(users);
        if (!usernames.length) {
          contentEl.innerHTML = `<div class="empty-msg">${i18n[adminLang].emptyUser}</div>`;
          return;
        }
        contentEl.innerHTML = usernames.map(u => {
          const rec = users[u];
          const safeId = encodeURIComponent(u);
          return `
            <div class="record-card">
              <div class="record-top">
                <span class="record-user">👤 User: ${u}</span>
                <span class="record-amount">${Number(rec.balance || 0).toFixed(2)} ETB</span>
              </div>
              <div class="record-details">
                <div><strong>Phone / Username:</strong> ${rec.phone || u}</div>
                <div><strong>Balance:</strong> ${Number(rec.balance || 0).toFixed(2)} ETB</div>
                <div><strong>Invested:</strong> ${Number(rec.invested || 0).toFixed(2)} ETB</div>
                <div><strong>Referral Bonus:</strong> ${Number(rec.refBonus || 0).toFixed(2)} ETB</div>
                <div><strong>History Entries:</strong> ${(rec.history || []).length}</div>
              </div>
              <div class="adjust-row">
                <input type="number" id="adj-amt-${safeId}" placeholder="Amount (ETB)" />
                <button class="btn-green" onclick="adjustUserBalance('${u}', '${safeId}', 'add')">${i18n[adminLang].addBtn}</button>
                <button class="btn-red" onclick="adjustUserBalance('${u}', '${safeId}', 'sub')">${i18n[adminLang].deductBtn}</button>
              </div>
            </div>
          `;
        }).join("");
        return;
      }

      if (activeAdminTab === "deposit") {
        titleEl.innerText = "💳 Deposit — User Submissions & Full Info";
        const list = reqs.deposits || [];
        if (!list.length) {
          contentEl.innerHTML = `<div class="empty-msg">${i18n[adminLang].emptyDeposit}</div>`;
          return;
        }
        contentEl.innerHTML = list.map(d => `
          <div class="record-card">
            <div class="record-top">
              <span class="record-user">👤 ${d.username}</span>
              <div>${renderBadge(d.status)} <span class="record-amount">${Number(d.amount || 0).toFixed(2)} ETB</span></div>
            </div>
            <div class="record-details">
              <div><strong>Method:</strong> ${d.method || "-"}</div>
              <div><strong>Amount:</strong> ${Number(d.amount || 0).toFixed(2)} ETB</div>
              <div><strong>Screenshot File:</strong> ${d.screenshotName || "No file"}</div>
              <div><strong>Time:</strong> ${d.time || "-"}</div>
            </div>
            <div class="action-btns-grid four-cols">
              <button class="btn-green" onclick="decideActivity('deposit', '${d.id}', 'approve')">Approve</button>
              <button class="btn-red" onclick="decideActivity('deposit', '${d.id}', 'reject')">Reject</button>
              <button class="btn-amber" onclick="reviewActivity('deposit', '${d.id}')">Review</button>
              <button class="btn-dark-del" onclick="deleteActivity('deposit', '${d.id}')">Delete</button>
            </div>
          </div>
        `).join("");
        return;
      }

      if (activeAdminTab === "withdrawal") {
        titleEl.innerText = "💸 Withdrawal — User Requests & Full Info";
        const list = reqs.withdrawals || [];
        if (!list.length) {
          contentEl.innerHTML = `<div class="empty-msg">${i18n[adminLang].emptyWithdrawal}</div>`;
          return;
        }
        contentEl.innerHTML = list.map(w => `
          <div class="record-card">
            <div class="record-top">
              <span class="record-user">👤 ${w.username}</span>
              <div>${renderBadge(w.status)} <span class="record-amount">${Number(w.amount || 0).toFixed(2)} ETB</span></div>
            </div>
            <div class="record-details">
              <div><strong>Method:</strong> ${w.method || "-"}</div>
              <div><strong>User Account / Phone:</strong> ${w.account || "-"}</div>
              <div><strong>Amount:</strong> ${Number(w.amount || 0).toFixed(2)} ETB</div>
              <div><strong>Fee (5%):</strong> -${Number(w.fee || 0).toFixed(2)} ETB</div>
              <div><strong>Net Pay:</strong> ${Number(w.netPay || 0).toFixed(2)} ETB</div>
              <div><strong>Time:</strong> ${w.time || "-"}</div>
            </div>
            <div class="action-btns-grid four-cols">
              <button class="btn-green" onclick="decideActivity('withdrawal', '${w.id}', 'approve')">Approve</button>
              <button class="btn-red" onclick="decideActivity('withdrawal', '${w.id}', 'reject')">Reject</button>
              <button class="btn-amber" onclick="reviewActivity('withdrawal', '${w.id}')">Review</button>
              <button class="btn-dark-del" onclick="deleteActivity('withdrawal', '${w.id}')">Delete</button>
            </div>
          </div>
        `).join("");
        return;
      }

      if (activeAdminTab === "investment") {
        titleEl.innerText = "📦 Investment — Package Requests & Full Info";
        const list = reqs.packages || [];
        if (!list.length) {
          contentEl.innerHTML = `<div class="empty-msg">${i18n[adminLang].emptyInvestment}</div>`;
          return;
        }
        contentEl.innerHTML = list.map(p => `
          <div class="record-card">
            <div class="record-top">
              <span class="record-user">👤 ${p.username}</span>
              <div>${renderBadge(p.status)} <span class="record-amount">${Number(p.amount || 0).toFixed(2)} ETB</span></div>
            </div>
            <div class="record-details">
              <div><strong>Package:</strong> ${p.pkgName || "-"}</div>
              <div><strong>Schedule:</strong> ${p.intervalDesc || "-"}</div>
              <div><strong>Expected Profit (ROI):</strong> +${Number(p.userProfit || 0).toFixed(2)} ETB</div>
              <div><strong>Invested Amount:</strong> ${Number(p.amount || 0).toFixed(2)} ETB</div>
              <div><strong>Time:</strong> ${p.time || "-"}</div>
            </div>
            <div class="action-btns-grid four-cols">
              <button class="btn-green" onclick="decideActivity('package', '${p.id}', 'approve')">Approve</button>
              <button class="btn-red" onclick="decideActivity('package', '${p.id}', 'reject')">Reject</button>
              <button class="btn-amber" onclick="reviewActivity('package', '${p.id}')">Review</button>
              <button class="btn-dark-del" onclick="deleteActivity('package', '${p.id}')">Delete</button>
            </div>
          </div>
        `).join("");
        return;
      }

      if (activeAdminTab === "referral") {
        titleEl.innerText = "👥 Referral — Referral Requests & Full Info";
        const list = reqs.referrals || [];
        if (!list.length) {
          contentEl.innerHTML = `<div class="empty-msg">${i18n[adminLang].emptyReferral}</div>`;
          return;
        }
        contentEl.innerHTML = list.map(r => `
          <div class="record-card">
            <div class="record-top">
              <span class="record-user">👤 ${r.username}</span>
              <div>${renderBadge(r.status)} <span class="record-amount">+${Number(r.amount || 100).toFixed(2)} ETB</span></div>
            </div>
            <div class="record-details">
              <div><strong>Referral Link:</strong> ${r.refLink || "-"}</div>
              <div><strong>Bonus Amount:</strong> +${Number(r.amount || 100).toFixed(2)} ETB</div>
              <div><strong>Time:</strong> ${r.time || "-"}</div>
            </div>
            <div class="action-btns-grid four-cols">
              <button class="btn-green" onclick="decideActivity('referral', '${r.id}', 'approve')">Approve</button>
              <button class="btn-red" onclick="decideActivity('referral', '${r.id}', 'reject')">Reject</button>
              <button class="btn-amber" onclick="reviewActivity('referral', '${r.id}')">Review</button>
              <button class="btn-dark-del" onclick="deleteActivity('referral', '${r.id}')">Delete</button>
            </div>
          </div>
        `).join("");
      }
    }

    async function deleteActivity(kind, id) {
      const endpointMap = {
        deposit: `/api/admin/deposits/${encodeURIComponent(id)}`,
        withdrawal: `/api/admin/withdrawals/${encodeURIComponent(id)}`,
        referral: `/api/admin/referrals/${encodeURIComponent(id)}`,
        package: `/api/admin/packages/${encodeURIComponent(id)}`
      };
      try {
        await apiRequest(endpointMap[kind], { method: "DELETE" });
        await syncAllData();
      } catch (err) {
        alert(err.message);
      }
    }

    async function decideActivity(kind, id, action) {
      const endpointMap = {
        deposit: `/api/admin/deposits/${encodeURIComponent(id)}/decide`,
        withdrawal: `/api/admin/withdrawals/${encodeURIComponent(id)}/decide`,
        referral: `/api/admin/referrals/${encodeURIComponent(id)}/decide`,
        package: `/api/admin/packages/${encodeURIComponent(id)}/decide`
      };
      try {
        await apiRequest(endpointMap[kind], {
          method: "POST",
          body: JSON.stringify({ action })
        });
        await syncAllData();
      } catch (err) {
        alert(err.message);
      }
    }

    async function adjustUserBalance(username, safeId, mode) {
      const inputEl = document.getElementById("adj-amt-" + safeId);
      const val = parseFloat(inputEl.value);
      if (isNaN(val) || val <= 0) {
        alert("Enter a valid ETB amount.");
        return;
      }
      try {
        await apiRequest(`/api/admin/users/${encodeURIComponent(username)}/balance`, {
          method: "POST",
          body: JSON.stringify({ amount: val, mode })
        });
        inputEl.value = "";
        await syncAllData();
      } catch (err) {
        alert(err.message);
      }
    }

    function reviewActivity(kind, id) {
      const reqs = latestAdminState.requests || {};
      const arr =
        kind === "deposit" ? (reqs.deposits || []) :
        kind === "withdrawal" ? (reqs.withdrawals || []) :
        kind === "referral" ? (reqs.referrals || []) : (reqs.packages || []);
      const item = arr.find(x => x.id === id);
      if (!item) return;

      let html = `
        <div><strong>Type:</strong> ${kind.toUpperCase()}</div>
        <div><strong>User:</strong> ${item.username}</div>
        <div><strong>Amount:</strong> ${Number(item.amount || 0).toFixed(2)} ETB</div>
        <div><strong>Status:</strong> ${item.status}</div>
        <div><strong>Time:</strong> ${item.time || ""}</div>
      `;
      if (item.pkgName) html += `<div><strong>Package:</strong> ${item.pkgName} (${item.intervalDesc || ""})</div>`;
      if (item.method) html += `<div><strong>Method:</strong> ${item.method}</div>`;
      if (item.account) html += `<div><strong>User Account:</strong> ${item.account}</div>`;
      if (typeof item.netPay !== "undefined") html += `<div><strong>Net Pay (5% fee):</strong> ${Number(item.netPay).toFixed(2)} ETB</div>`;
      if (item.refLink) html += `<div><strong>Referral Link:</strong> ${item.refLink}</div>`;
      if (item.screenshotDataUrl) html += `<div><strong>Payment Screenshot:</strong></div><img src="${item.screenshotDataUrl}" class="modal-img" alt="Screenshot" />`;
      document.getElementById("reviewModalBody").innerHTML = html;
      document.getElementById("review-modal").classList.add("active");
    }

    function closeReviewModal() {
      document.getElementById("review-modal").classList.remove("active");
    }

    setInterval(() => {
      if (document.getElementById("admin-panel").style.display === "block") syncAllData();
    }, 3000);

    if (sessionStorage.getItem("ethio_admin_unlocked") === "true") {
      document.getElementById("admin-gate").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      syncAllData();
    }
  </script>
</body>
</html>
