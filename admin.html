<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EthioInvest - Admin Control Panel</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #090d16;
      color: #f8fafc;
      padding: 14px;
      max-width: 680px;
      margin: 0 auto;
      min-height: 100vh;
    }

    /* Header with Right-Corner En / አማ Switcher */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #111827;
      border: 1px solid #1f2937;
      padding: 13px 15px;
      border-radius: 14px;
      margin-bottom: 14px;
      gap: 10px;
    }
    .admin-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .admin-sub {
      font-size: 0.74rem;
      color: #94a3b8;
      margin-top: 2px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .lang-box {
      display: flex;
      background: #0b1120;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid #334155;
    }
    .lang-btn {
      background: transparent;
      color: #94a3b8;
      border: none;
      padding: 5px 9px;
      font-size: 0.78rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
    }
    .lang-btn.active {
      background: #0284c7;
      color: #ffffff;
    }
    .sync-btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Admin Login Gate */
    #admin-gate {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 20px;
      margin-top: 18px;
    }
    #admin-gate h2 {
      font-size: 1.05rem;
      color: #38bdf8;
      margin-bottom: 12px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    .form-group input {
      width: 100%;
      padding: 9px 11px;
      border-radius: 8px;
      border: 1px solid #374155;
      background: #0b1120;
      color: #f8fafc;
      font-size: 0.88rem;
    }
    .btn-blue {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-green {
      background: #16a34a;
      color: #ffffff;
      border: none;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-red {
      background: #dc2626;
      color: #ffffff;
      border: none;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-amber {
      background: #d97706;
      color: #ffffff;
      border: none;
      padding: 6px 9px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Overview Cards */
    #admin-panel {
      display: none;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 13px;
    }
    .stat-card span {
      display: block;
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .stat-card strong {
      font-size: 1.12rem;
      color: #38bdf8;
    }

    /* Consolidated Per-User Activity Block & Table */
    .user-activity-block {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .user-block-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #1f2937;
    }
    .user-block-title {
      font-size: 0.96rem;
      font-weight: 800;
      color: #38bdf8;
    }
    .user-block-bal {
      font-size: 0.9rem;
      font-weight: 800;
      color: #4ade80;
    }
    .user-submeta {
      font-size: 0.76rem;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .activity-table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #1f2937;
      background: #0b1120;
    }
    .activity-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      min-width: 520px;
    }
    .activity-table th {
      background: #162033;
      color: #cbd5e1;
      text-align: left;
      padding: 8px 9px;
      border-bottom: 1px solid #1f2937;
      font-weight: 700;
    }
    .activity-table td {
      padding: 8px 9px;
      border-bottom: 1px solid #131c2e;
      color: #e2e8f0;
      vertical-align: middle;
    }
    .activity-table tr:last-child td {
      border-bottom: none;
    }

    .status-pill {
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      display: inline-block;
    }
    .status-pending { background: rgba(245, 158, 11, 0.2); color: #fbbf24; }
    .status-approved { background: rgba(34, 197, 94, 0.2); color: #4ade80; }
    .status-rejected { background: rgba(239, 68, 68, 0.2); color: #f87171; }
    .status-reviewed { background: rgba(56, 189, 248, 0.2); color: #38bdf8; }

    .action-btns-inline {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .adjust-row {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .adjust-row input {
      flex: 1;
      min-width: 120px;
      padding: 7px 9px;
      border-radius: 7px;
      border: 1px solid #374151;
      background: #0b1120;
      color: #ffffff;
      font-size: 0.82rem;
    }

    /* Review Modal */
    #review-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 9999;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    #review-modal.active {
      display: flex;
    }
    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-card h4 {
      color: #38bdf8;
      margin-bottom: 10px;
      font-size: 1rem;
    }
    .modal-img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 8px;
      background: #0b1120;
      border: 1px solid #1f2937;
      margin: 10px 0;
    }
    .empty-msg {
      font-size: 0.84rem;
      color: #94a3b8;
      text-align: center;
      padding: 16px 0;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER WITH RIGHT-CORNER LANGUAGE CHOICE (En / አማ) -->
  <div class="admin-header">
    <div>
      <div class="admin-title" data-i18n="adminTitle">EthioInvest Admin</div>
      <div class="admin-sub" data-i18n="adminSub">Per-User Activity Table • Approve / Reject / Review</div>
    </div>
    <div class="header-right">
      <button class="sync-btn" onclick="syncAllData()" data-i18n="syncBtn">↻ Sync</button>
      <div class="lang-box">
        <button class="lang-btn" id="btnEnAdmin" onclick="setAdminLanguage('en')">En</button>
        <button class="lang-btn active" id="btnAmAdmin" onclick="setAdminLanguage('am')">አማ</button>
      </div>
    </div>
  </div>

  <!-- ADMIN ACCESS GATE -->
  <div id="admin-gate">
    <h2 data-i18n="gateTitle">አስተዳዳሪ መግቢያ (Admin Access)</h2>
    <div class="form-group">
      <label data-i18n="pinLabel">Admin PIN / Passcode (Default: 1234)</label>
      <input type="password" id="adminPassInput" placeholder="1234" />
    </div>
    <button class="btn-blue" style="width: 100%;" onclick="unlockAdmin()" data-i18n="openPanelBtn">Open Admin Dashboard</button>
  </div>

  <!-- MAIN ADMIN DASHBOARD -->
  <div id="admin-panel">
    <div class="stats-grid">
      <div class="stat-card">
        <span data-i18n="statUsers">ጠቅላላ ተጠቃሚዎች (Total Users)</span>
        <strong id="statUsersCount">0</strong>
      </div>
      <div class="stat-card">
        <span data-i18n="statBalances">ጠቅላላ የተጠቃሚ ሂሳብ</span>
        <strong id="statTotalBalance">0.00 ETB</strong>
      </div>
      <div class="stat-card">
        <span data-i18n="statPendingDep">Pending Deposits</span>
        <strong id="statPendingDeposits">0</strong>
      </div>
      <div class="stat-card">
        <span data-i18n="statPendingWith">Pending Withdrawals</span>
        <strong id="statPendingWithdrawals">0</strong>
      </div>
    </div>

    <!-- CONSOLIDATED PER-USER ACTIVITY TABLES -->
    <div id="consolidatedUsersContainer"></div>
  </div>

  <!-- REVIEW MODAL -->
  <div id="review-modal">
    <div class="modal-card">
      <h4 data-i18n="reviewTitle">Review Activity Details</h4>
      <div id="reviewModalBody" style="font-size: 0.82rem; color: #cbd5e1; line-height: 1.55;"></div>
      <button class="btn-blue" style="width: 100%; margin-top: 12px;" onclick="closeReviewModal()" data-i18n="closeBtn">Close</button>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "1234";
    let adminLang = "am";

    const i18n = {
      am: {
        adminTitle: "EthioInvest Admin",
        adminSub: "የእያንዳንዱ User እንቅስቃሴ በአንድ ሰንጠረዥ • Approve / Reject / Review",
        syncBtn: "↻ አድስ",
        gateTitle: "አስተዳዳሪ መግቢያ (Admin Access)",
        pinLabel: "የአድሚን ፒን (Default: 1234)",
        openPanelBtn: "አድሚን ፓነል ክፈት",
        statUsers: "ጠቅላላ ተጠቃሚዎች",
        statBalances: "ጠቅላላ የተጠቃሚ ሂሳብ",
        statPendingDep: "በመጠባበቅ ላይ ያሉ Deposits",
        statPendingWith: "በመጠባበቅ ላይ ያሉ Withdrawals",
        colType: "አይነት",
        colDetail: "ዝርዝር / ቀን-ሰዓት",
        colAmount: "መጠን",
        colStatus: "ሁኔታ",
        colAction: "ቁጥጥር",
        noUserActivity: "ለዚህ ተጠቃሚ እስካሁን የተመዘገበ Deposit / Withdrawal / Referral የለም።",
        noUsersAtAll: "እስካሁን የተመዘገበ ተጠቃሚ የለም።",
        addBtn: "+ ጨምር",
        deductBtn: "- ቀንስ",
        reviewTitle: "የእንቅስቃሴ ዝርዝር (Review)",
        closeBtn: "ዝጋ"
      },
      en: {
        adminTitle: "EthioInvest Admin",
        adminSub: "Consolidated Per-User Table • Approve / Reject / Review",
        syncBtn: "↻ Sync",
        gateTitle: "Admin Access",
        pinLabel: "Admin PIN / Passcode (Default: 1234)",
        openPanelBtn: "Open Admin Dashboard",
        statUsers: "Total Users",
        statBalances: "Total User Balances",
        statPendingDep: "Pending Deposits",
        statPendingWith: "Pending Withdrawals",
        colType: "Type",
        colDetail: "Details / Time",
        colAmount: "Amount",
        colStatus: "Status",
        colAction: "Action",
        noUserActivity: "No Deposit, Withdrawal, or Referral activity for this user yet.",
        noUsersAtAll: "No registered users yet.",
        addBtn: "+ Add",
        deductBtn: "- Deduct",
        reviewTitle: "Review Activity Details",
        closeBtn: "Close"
      }
    };

    function setAdminLanguage(lang) {
      adminLang = lang;
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (i18n[lang][key]) el.innerText = i18n[lang][key];
      });
      document.getElementById("btnEnAdmin").classList.toggle("active", lang === "en");
      document.getElementById("btnAmAdmin").classList.toggle("active", lang === "am");
      if (document.getElementById("admin-panel").style.display === "block") {
        syncAllData();
      }
    }

    function unlockAdmin() {
      const pin = document.getElementById("adminPassInput").value.trim();
      if (pin !== ADMIN_PIN) {
        alert("Incorrect Admin PIN! Default PIN is 1234");
        return;
      }
      sessionStorage.setItem("ethio_admin_unlocked", "true");
      document.getElementById("admin-gate").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      syncAllData();
    }

    function readUsers() {
      return JSON.parse(localStorage.getItem("ethio_users") || "{}");
    }

    function writeUsers(users) {
      localStorage.setItem("ethio_users", JSON.stringify(users));
    }

    function readAdminRequests() {
      return JSON.parse(
        localStorage.getItem("ethio_admin_requests") ||
          JSON.stringify({ deposits: [], withdrawals: [], referrals: [] })
      );
    }

    function writeAdminRequests(reqs) {
      localStorage.setItem("ethio_admin_requests", JSON.stringify(reqs));
    }

    function renderBadge(status) {
      const cls =
        status === "approved"
          ? "status-approved"
          : status === "rejected"
          ? "status-rejected"
          : status === "reviewed"
          ? "status-reviewed"
          : "status-pending";
      return `<span class="status-pill ${cls}">${status}</span>`;
    }

    // Collects all Deposit, Withdrawal, and Referral items for a single user in chronological order
    function getUserConsolidatedActivities(username, reqs) {
      const items = [];

      (reqs.deposits || [])
        .filter(d => d.username === username)
        .forEach(d => {
          items.push({
            id: d.id,
            kind: "deposit",
            kindLabel: "Deposit",
            detail: `${d.method || ""} • ${d.screenshotName || "No file"} • ${d.time || ""}`,
            amount: Number(d.amount || 0),
            status: d.status || "pending",
            raw: d
          });
        });

      (reqs.withdrawals || [])
        .filter(w => w.username === username)
        .forEach(w => {
          items.push({
            id: w.id,
            kind: "withdrawal",
            kindLabel: "Withdrawal",
            detail: `${w.method || ""} (${w.account || ""}) | Net: ${Number(w.netPay || 0).toFixed(2)} • ${w.time || ""}`,
            amount: Number(w.amount || 0),
            status: w.status || "pending",
            raw: w
          });
        });

      (reqs.referrals || [])
        .filter(r => r.username === username)
        .forEach(r => {
          items.push({
            id: r.id,
            kind: "referral",
            kindLabel: "Referral",
            detail: `${r.refLink || "Bonus"} • ${r.time || ""}`,
            amount: Number(r.amount || 100),
            status: r.status || "pending",
            raw: r
          });
        });

      // Sort newest first using timestamp in id if available
      items.sort((a, b) => {
        const ta = parseInt((a.id || "").split("_")[1] || "0", 10);
        const tb = parseInt((b.id || "").split("_")[1] || "0", 10);
        return tb - ta;
      });

      return items;
    }

    function syncAllData() {
      const users = readUsers();
      const reqs = readAdminRequests();

      const userNames = Object.keys(users);
      let totalBal = 0;
      userNames.forEach(u => {
        totalBal += Number(users[u].balance || 0);
      });

      const pendingDep = (reqs.deposits || []).filter(d => d.status === "pending" || d.status === "reviewed").length;
      const pendingWith = (reqs.withdrawals || []).filter(w => w.status === "pending" || w.status === "reviewed").length;

      document.getElementById("statUsersCount").innerText = userNames.length;
      document.getElementById("statTotalBalance").innerText =
        totalBal.toLocaleString("en-US", { minimumFractionDigits: 2 }) + " ETB";
      document.getElementById("statPendingDeposits").innerText = pendingDep;
      document.getElementById("statPendingWithdrawals").innerText = pendingWith;

      renderConsolidatedUsers(users, reqs);
    }

    function renderConsolidatedUsers(users, reqs) {
      const container = document.getElementById("consolidatedUsersContainer");
      const usernames = Object.keys(users);

      if (!usernames.length) {
        container.innerHTML = `<div class="user-activity-block"><div class="empty-msg">${i18n[adminLang].noUsersAtAll}</div></div>`;
        return;
      }

      container.innerHTML = usernames
        .map(u => {
          const rec = users[u];
          const safeId = encodeURIComponent(u);
          const activities = getUserConsolidatedActivities(u, reqs);

          let tableHtml = "";
          if (!activities.length) {
            tableHtml = `<div class="empty-msg">${i18n[adminLang].noUserActivity}</div>`;
          } else {
            const rows = activities
              .map(
                act => `
                <tr>
                  <td><strong>${act.kindLabel}</strong></td>
                  <td>${act.detail}</td>
                  <td><strong>${act.amount.toFixed(2)} ETB</strong></td>
                  <td>${renderBadge(act.status)}</td>
                  <td>
                    <div class="action-btns-inline">
                      <button class="btn-green" onclick="decideActivity('${act.kind}', '${act.id}', 'approve')">Approve</button>
                      <button class="btn-red" onclick="decideActivity('${act.kind}', '${act.id}', 'reject')">Reject</button>
                      <button class="btn-amber" onclick="reviewActivity('${act.kind}', '${act.id}')">Review</button>
                    </div>
                  </td>
                </tr>
              `
              )
              .join("");

            tableHtml = `
              <div class="activity-table-wrap">
                <table class="activity-table">
                  <thead>
                    <tr>
                      <th>${i18n[adminLang].colType}</th>
                      <th>${i18n[adminLang].colDetail}</th>
                      <th>${i18n[adminLang].colAmount}</th>
                      <th>${i18n[adminLang].colStatus}</th>
                      <th>${i18n[adminLang].colAction}</th>
                    </tr>
                  </thead>
                  <tbody>${rows}</tbody>
                </table>
              </div>
            `;
          }

          return `
            <div class="user-activity-block">
              <div class="user-block-header">
                <span class="user-block-title">👤 ${u}</span>
                <span class="user-block-bal">${Number(rec.balance || 0).toFixed(2)} ETB</span>
              </div>
              <div class="user-submeta">
                Invested: ${Number(rec.invested || 0).toFixed(2)} ETB • Referral Bonus: ${Number(rec.refBonus || 0).toFixed(2)} ETB • Total Activities: ${activities.length}
              </div>

              ${tableHtml}

              <div class="adjust-row">
                <input type="number" id="adj-amt-${safeId}" placeholder="ETB" />
                <button class="btn-green" onclick="adjustUserBalance('${u}', '${safeId}', 'add')">${i18n[adminLang].addBtn}</button>
                <button class="btn-red" onclick="adjustUserBalance('${u}', '${safeId}', 'sub')">${i18n[adminLang].deductBtn}</button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    function decideActivity(kind, id, action) {
      const users = readUsers();
      const reqs = readAdminRequests();
      const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      if (kind === "deposit") {
        const item = (reqs.deposits || []).find(d => d.id === id);
        if (!item || !users[item.username]) return;
        const amt = Number(item.amount || 0);

        if (action === "approve") {
          if (!item.appliedToBalance) {
            users[item.username].balance = Number(users[item.username].balance || 0) + amt;
            users[item.username].history.unshift({
              title: `Admin Approved Deposit (${item.method})`,
              amount: amt,
              type: "plus",
              time: timeStr
            });
            item.appliedToBalance = true;
          }
          item.status = "approved";
        } else if (action === "reject") {
          if (item.appliedToBalance) {
            users[item.username].balance = Math.max(0, Number(users[item.username].balance || 0) - amt);
            users[item.username].history.unshift({
              title: `Admin Rejected Deposit (${item.method})`,
              amount: amt,
              type: "minus",
              time: timeStr
            });
            item.appliedToBalance = false;
          }
          item.status = "rejected";
        }
      } else if (kind === "withdrawal") {
        const item = (reqs.withdrawals || []).find(w => w.id === id);
        if (!item || !users[item.username]) return;
        const amt = Number(item.amount || 0);

        if (action === "approve") {
          if (!item.deductedFromBalance) {
            users[item.username].balance = Math.max(0, Number(users[item.username].balance || 0) - amt);
            item.deductedFromBalance = true;
          }
          users[item.username].history.unshift({
            title: `Admin Approved Withdraw (${item.method}) | Net Pay = ${Number(item.netPay || 0).toFixed(2)} ETB`,
            amount: amt,
            type: "minus",
            time: timeStr
          });
          item.status = "approved";
        } else if (action === "reject") {
          if (item.deductedFromBalance) {
            users[item.username].balance = Number(users[item.username].balance || 0) + amt;
            users[item.username].history.unshift({
              title: `Admin Rejected Withdraw (Refunded ${item.method})`,
              amount: amt,
              type: "plus",
              time: timeStr
            });
            item.deductedFromBalance = false;
          }
          item.status = "rejected";
        }
      } else if (kind === "referral") {
        const item = (reqs.referrals || []).find(r => r.id === id);
        if (!item || !users[item.username]) return;
        const bonus = Number(item.amount || 100);

        if (action === "approve") {
          if (!item.appliedToBalance) {
            users[item.username].balance = Number(users[item.username].balance || 0) + bonus;
            users[item.username].refBonus = Number(users[item.username].refBonus || 0) + bonus;
            users[item.username].history.unshift({
              title: "Admin Approved Referral Bonus",
              amount: bonus,
              type: "plus",
              time: timeStr
            });
            item.appliedToBalance = true;
          }
          item.status = "approved";
        } else if (action === "reject") {
          if (item.appliedToBalance) {
            users[item.username].balance = Math.max(0, Number(users[item.username].balance || 0) - bonus);
            users[item.username].refBonus = Math.max(0, Number(users[item.username].refBonus || 0) - bonus);
            users[item.username].history.unshift({
              title: "Admin Rejected Referral Bonus",
              amount: bonus,
              type: "minus",
              time: timeStr
            });
            item.appliedToBalance = false;
          }
          item.status = "rejected";
        }
      }

      writeUsers(users);
      writeAdminRequests(reqs);
      syncAllData();
    }

    function adjustUserBalance(username, safeId, mode) {
      const inputEl = document.getElementById("adj-amt-" + safeId);
      const val = parseFloat(inputEl.value);
      if (isNaN(val) || val <= 0) {
        alert("Enter a valid ETB amount.");
        return;
      }

      const users = readUsers();
      if (!users[username]) return;
      const timeStr = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

      if (mode === "add") {
        users[username].balance = Number(users[username].balance || 0) + val;
        users[username].history.unshift({
          title: "Admin Added Balance",
          amount: val,
          type: "plus",
          time: timeStr
        });
      } else {
        users[username].balance = Math.max(0, Number(users[username].balance || 0) - val);
        users[username].history.unshift({
          title: "Admin Deducted Balance",
          amount: val,
          type: "minus",
          time: timeStr
        });
      }

      writeUsers(users);
      inputEl.value = "";
      syncAllData();
    }

    function reviewActivity(kind, id) {
      const reqs = readAdminRequests();
      const arr =
        kind === "deposit"
          ? reqs.deposits || []
          : kind === "withdrawal"
          ? reqs.withdrawals || []
          : reqs.referrals || [];
      const item = arr.find(x => x.id === id);
      if (!item) return;

      if (item.status === "pending") {
        item.status = "reviewed";
        writeAdminRequests(reqs);
      }

      let html = `
        <div><strong>Type:</strong> ${kind.toUpperCase()}</div>
        <div><strong>User:</strong> ${item.username}</div>
        <div><strong>Amount:</strong> ${Number(item.amount || 0).toFixed(2)} ETB</div>
        <div><strong>Status:</strong> ${item.status}</div>
        <div><strong>Time:</strong> ${item.time || ""}</div>
      `;

      if (item.method) html += `<div><strong>Method:</strong> ${item.method}</div>`;
      if (item.account) html += `<div><strong>User Account:</strong> ${item.account}</div>`;
      if (typeof item.netPay !== "undefined") {
        html += `<div><strong>Net Pay (5% fee):</strong> ${Number(item.netPay).toFixed(2)} ETB</div>`;
      }
      if (item.refLink) html += `<div><strong>Referral Link:</strong> ${item.refLink}</div>`;
      if (item.screenshotDataUrl) {
        html += `<div><strong>Payment Screenshot:</strong></div><img src="${item.screenshotDataUrl}" class="modal-img" alt="Screenshot" />`;
      }

      document.getElementById("reviewModalBody").innerHTML = html;
      document.getElementById("review-modal").classList.add("active");
      syncAllData();
    }

    function closeReviewModal() {
      document.getElementById("review-modal").classList.remove("active");
    }

    setInterval(() => {
      if (document.getElementById("admin-panel").style.display === "block") {
        syncAllData();
      }
    }, 5000);

    if (sessionStorage.getItem("ethio_admin_unlocked") === "true") {
      document.getElementById("admin-gate").style.display = "none";
      document.getElementById("admin-panel").style.display = "block";
      syncAllData();
    }
  </script>
</body>
</html>
