<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#0f172a,#111827,#1e293b);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
}

.login-box{
  width:90%;
  max-width:380px;
  background:#1e293b;
  padding:30px;
  border-radius:18px;
  border:1px solid #334155;
  box-shadow:0 15px 45px rgba(0,0,0,.4);
}

h2{
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#94a3b8;
  margin-bottom:25px;
}

input{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:1px solid #475569;
  border-radius:10px;
  background:#0f172a;
  color:white;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  background:#2563eb;
  border:none;
  border-radius:10px;
  color:white;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}

button:hover{
  background:#1d4ed8;
}

#error{
  color:#f87171;
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>Admin Portal</h2>
  <div class="subtitle">Authorized access only</div>

  <form id="loginForm">
    <input
      type="email"
      id="email"
      placeholder="Admin Email"
      required
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      required
    >

    <button type="submit">Login</button>
    <p id="error"></p>
  </form>
</div>

<script>
document.getElementById("loginForm")
.addEventListener("submit", function(e){

  e.preventDefault();

  document.getElementById("error").textContent =
  "Connect this login to your secure authentication service.";

});
</script>

</body>
</html>
