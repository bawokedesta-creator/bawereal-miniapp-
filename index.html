
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>BaweReal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fb;color:#18243b;font-family:Arial,sans-serif}
header{padding:20px;background:#fff;font-size:21px;font-weight:bold;display:flex;justify-content:space-between;align-items:center}
main{padding:16px;padding-bottom:100px}
.hero{background:linear-gradient(135deg,#1457ee,#34328e);color:white;padding:24px;border-radius:24px}
.hero h2{font-size:24px;margin:12px 0}
.hero p{opacity:.85;font-size:14px}
.tag{font-size:12px;background:#ffffff22;padding:7px 12px;border-radius:20px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:18px}
.tile{background:white;border-radius:18px;padding:20px 12px;text-align:center;box-shadow:0 3px 12px #172b4a0a;cursor:pointer}
.tile:active{transform:scale(.97)}
.tile .emoji{font-size:28px}
.tile b{display:block;margin-top:10px}
.section{margin-top:20px}
.section-title{font-size:18px;font-weight:bold;margin-bottom:12px}
.panel{background:white;padding:18px;border-radius:18px;margin-bottom:12px}
.muted{color:#7c8799;font-size:14px}
button{border:0;border-radius:12px;padding:12px 16px;background:#2055e8;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#eef3ff;color:#2055e8}
button.full{width:100%;margin-top:12px}
input{width:100%;padding:14px;border:1px solid #dce3ed;border-radius:12px;margin-top:10px;font-size:15px}
nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e6eaf0;display:flex;justify-content:space-around;padding:9px 2px calc(9px + env(safe-area-inset-bottom));z-index:5}
nav button{background:none;color:#77849a;padding:6px 4px;font-size:11px;font-weight:normal;min-width:50px}
nav button.active{color:#2055e8;font-weight:bold}
nav span{display:block;font-size:20px;margin-bottom:3px}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <span>BaweReal</span>
  <span style="font-size:14px;color:#7c8799">☰</span>
</header>

<main id="app"></main>

<nav id="nav">
<button data-page="home" class="active"><span>⌂</span>Home</button>
<button data-page="packages"><span>▤</span>Packages</button>
<button data-page="referrals"><span>♧</span>Referrals</button>
<button data-page="profile"><span>♙</span>Profile</button>
<button data-page="chat"><span>☏</span>Chat</button>
</nav>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

const app = document.getElementById("app");

function go(page){
  document.querySelectorAll("#nav button").forEach(b=>{
    b.classList.toggle("active",b.dataset.page===page);
  });

  if(page==="home"){
    app.innerHTML=`
      <div class="hero">
        <span class="tag">WELCOME</span>
        <h2>Welcome to BaweReal</h2>
        <p>Your personal account dashboard</p>
      </div>

      <div class="grid">
        <div class="tile" onclick="go('packages')">
          <div class="emoji">▤</div><b>Packages</b>
        </div>
        <div class="tile" onclick="go('referrals')">
          <div class="emoji">♧</div><b>Referrals</b>
        </div>
        <div class="tile" onclick="go('history')">
          <div class="emoji">◷</div><b>History</b>
        </div>
        <div class="tile" onclick="go('profile')">
          <div class="emoji">♙</div><b>Profile</b>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Quick Access</div>
        <div class="panel">
          <b>Help & Support</b>
          <p class="muted">Questions about your account?</p>
          <button class="secondary" onclick="go('chat')">Open Support</button>
        </div>
      </div>
    `;
  }

  else if(page==="packages"){
    app.innerHTML=`
      <div class="section-title">Packages</div>
      <div class="panel">
        <h3>Available Services</h3>
        <p class="muted">Explore available platform services and their details.</p>
      </div>
      <div class="panel">
        <h3>Basic</h3>
        <p class="muted">Account access and platform features.</p>
        <button class="full" onclick="showInfo('Basic')">View Details</button>
      </div>
      <div class="panel">
        <h3>Standard</h3>
        <p class="muted">More platform features and account tools.</p>
        <button class="full" onclick="showInfo('Standard')">View Details</button>
      </div>
      <div class="panel">
        <h3>Premium</h3>
        <p class="muted">Premium service information.</p>
        <button class="full" onclick="showInfo('Premium')">View Details</button>
      </div>`;
  }

  else if(page==="referrals"){
    const link="https://t.me/BaweRealBot";
    app.innerHTML=`
      <div class="section-title">Referrals</div>
      <div class="panel">
        <h3>Invite Friends</h3>
        <p class="muted">Share the bot link with friends.</p>
        <input id="inviteLink" value="${link}" readonly>
        <button class="full" onclick="copyInvite()">Copy Invite Link</button>
        <button class="secondary full" onclick="shareInvite()">Share Link</button>
      </div>
      <div class="panel">
        <h3>Referral Information</h3>
        <p class="muted">Referral information will be available when the account system is connected.</p>
      </div>`;
  }

  else if(page==="profile"){
    const user=tg.initDataUnsafe?.user;
    const name=user
      ? [user.first_name,user.last_name].filter(Boolean).join(" ")
      : "Telegram User";
    const uname=user?.username ? "@"+user.username : "Not provided";
    app.innerHTML=`
      <div class="section-title">My Profile</div>
      <div class="panel">
        <h3>${escapeHtml(name)}</h3>
        <p class="muted">${escapeHtml(uname)}</p>
        <p class="muted">Telegram account profile</p>
      </div>
      <div class="panel">
        <b>Account Information</b>
        <p class="muted">Telegram ID: ${user?.id || "Open inside Telegram"}</p>
      </div>`;
  }

  else if(page==="history"){
    app.innerHTML=`
      <div class="section-title">Activity History</div>
      <div class="panel">
        <h3>Your Activity</h3>
        <p class="muted">Activity records will appear here when connected to the database.</p>
      </div>`;
  }

  else if(page==="chat"){
    app.innerHTML=`
      <div class="section-title">Support</div>
      <div class="panel">
        <h3>Customer Support</h3>
        <p class="muted">Need help? Contact support through Telegram.</p>
        <button class="full" onclick="contactSupport()">Contact Support</button>
      </div>
      <div class="panel">
        <b>Frequently Asked Questions</b>
        <p class="muted">How do I use the app?</p>
        <p>Choose a section from the navigation bar below.</p>
      </div>`;
  }
}

function showInfo(name){
  alert(name+" details will be available here.");
}

function copyInvite(){
  const input=document.getElementById("inviteLink");
  if(!input)return;
  navigator.clipboard.writeText(input.value)
    .then(()=>alert("Link copied!"))
    .catch(()=>{
      input.select();
      document.execCommand("copy");
      alert("Link copied!");
    });
}

function shareInvite(){
  const url="https://t.me/BaweRealBot";
  if(tg.openTelegramLink){
    tg.openTelegramLink("https://t.me/share/url?url="+encodeURIComponent(url));
  }else{
    window.open(url);
  }
}

function contactSupport(){
  alert("Support contact will be configured.");
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[m]);
}

document.querySelectorAll("#nav button").forEach(btn=>{
  btn.addEventListener("click",()=>go(btn.dataset.page));
});

go("home");
</script>
</body>
</html>
