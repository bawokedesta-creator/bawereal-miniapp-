<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BaweReal Mini App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f3f4f6; color: #111; padding-bottom: 80px; }
    header { background: #fff; padding: 14px 16px; border-bottom: 1px solid #e5e7eb; font-size: 20px; font-weight: bold; }
    main { padding: 16px; max-width: 650px; margin: 0 auto; }
    .box { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .box h3 { margin-bottom: 8px; }
    .box p { color: #4b5563; line-height: 1.5; }
    .hidden { display: none; }
    nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e5e7eb; display: flex; justify-content: space-around; padding: 10px 0; }
    nav button { background: none; border: none; font-size: 13px; color: #555; cursor: pointer; }
    nav button.active { color: #2563eb; font-weight: bold; }
  </style>
</head>
<body>
  <header>BaweReal</header>

  <main>
    <section id="sec-home" class="sec">
      <div class="box">
        <h3>Dashboard</h3>
        <p>Welcome to BaweReal Mini App! Balance: 0.00 | Referrals: 0</p>
      </div>
      <div class="box">
        <h3>Quick Info</h3>
        <p>If you see this text, the main dashboard is working properly.</p>
      </div>
    </section>

    <section id="sec-packages" class="sec hidden">
      <div class="box"><h3>Packages</h3><p>Packages list here.</p></div>
    </section>

    <section id="sec-referrals" class="sec hidden">
      <div class="box"><h3>Referrals</h3><p>Referrals list here.</p></div>
    </section>

    <section id="sec-profile" class="sec hidden">
      <div class="box"><h3>Profile</h3><p>User profile here.</p></div>
    </section>

    <section id="sec-chat" class="sec hidden">
      <div class="box"><h3>Chat</h3><p>Support &amp; chat here.</p></div>
    </section>
  </main>

  <nav>
    <button class="active" onclick="showSec('home', this)">Home</button>
    <button onclick="showSec('packages', this)">Packages</button>
    <button onclick="showSec('referrals', this)">Referrals</button>
    <button onclick="showSec('profile', this)">Profile</button>
    <button onclick="showSec('chat', this)">Chat</button>
  </nav>

  <script>
    function showSec(name, btn) {
      document.querySelectorAll(".sec").forEach(function(s) {
        s.classList.add("hidden");
      });
      var target = document.getElementById("sec-" + name);
      if (target) target.classList.remove("hidden");

      document.querySelectorAll("nav button").forEach(function(b) {
        b.classList.remove("active");
      });
      if (btn) btn.classList.add("active");
    }
  </script>
</body>
</html>
