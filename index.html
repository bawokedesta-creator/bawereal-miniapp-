
<style>
.auth-tabs {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:20px;
}
.auth-tabs button {
  padding:13px 5px;
  border:0;
  border-radius:9px;
  background:#e9f7ee;
  color:#07532f;
  font-weight:bold;
}
.auth-tabs button.active {
  background:#087b43;
  color:white;
}
.auth-card {
  background:white;
  padding:22px;
  border-radius:15px;
  border-top:4px solid #087b43;
}
</style>

<div id="authScreen" class="auth-wrapper">

  <div class="auth-heading">
    <h1>🌱 GreenVest</h1>
    <p>Welcome to GreenVest</p>
  </div>

  <div class="auth-tabs">
    <button id="loginTab" class="active"
      onclick="showAuth('login')">LOGIN</button>

    <button id="registerTab"
      onclick="showAuth('register')">REGISTER</button>
  </div>

  <!-- LOGIN -->
  <div id="loginBox" class="auth-card">
    <h2>Login Account</h2>

    <form id="loginForm">
      <input id="loginEmail" type="email"
        placeholder="Email Address" required>

      <input id="loginPassword" type="password"
        placeholder="Password" required>

      <button class="primary" type="submit">LOGIN</button>

      <p id="loginMessage" class="message"></p>
    </form>
  </div>

  <!-- REGISTER -->
  <div id="registerBox" class="auth-card hidden">
    <h2>Create Account</h2>

    <form id="registerForm">

      <input id="regName" type="text"
        placeholder="Full Name" required>

      <input id="regEmail" type="email"
        placeholder="Email Address" required>

      <input id="regPassword" type="password"
        placeholder="New Password (8 characters minimum)"
        minlength="8" required>

      <input id="regConfirm" type="password"
        placeholder="Confirm Password"
        minlength="8" required>

      <button class="primary" type="submit">
        CREATE ACCOUNT
      </button>

      <p id="registerMessage" class="message"></p>

    </form>
  </div>

</div>

<script>

// CHANGE BETWEEN LOGIN AND REGISTER

function showAuth(type) {

  const login = type === "login";

  document.getElementById("loginBox")
    .classList.toggle("hidden",!login);

  document.getElementById("registerBox")
    .classList.toggle("hidden",login);

  document.getElementById("loginTab")
    .classList.toggle("active",login);

  document.getElementById("registerTab")
    .classList.toggle("active",!login);
}


// REGISTER ACCOUNT

document.getElementById("registerForm")
.addEventListener("submit",function(e){

  e.preventDefault();

  const name = document.getElementById("regName").value.trim();
  const email = document.getElementById("regEmail").value.trim().toLowerCase();
  const password = document.getElementById("regPassword").value;
  const confirm = document.getElementById("regConfirm").value;

  const message = document.getElementById("registerMessage");

  if(password.length < 8){
    message.textContent = "Password must be at least 8 characters.";
    message.className = "message error";
    return;
  }

  if(password !== confirm){
    message.textContent = "Passwords do not match!";
    message.className = "message error";
    return;
  }

  const users = JSON.parse(
    localStorage.getItem("gv_users") || "{}"
  );

  if(users[email]){
    message.textContent = "Email already registered. Please login.";
    message.className = "message error";
    return;
  }

  users[email] = {
    name:name,
    email:email,
    password:password,
    balance:0,
    deposited:0,
    invested:0,
    withdrawn:0,
    code:"GV-"+Math.random().toString(36).slice(2,10).toUpperCase(),
    transactions:[],
    packages:[]
  };

  localStorage.setItem("gv_users",JSON.stringify(users));

  message.textContent = "Registration Successful! Returning to Login...";
  message.className = "message success";

  document.getElementById("loginEmail").value = email;

  document.getElementById("registerForm").reset();

  setTimeout(function(){

    showAuth("login");

    document.getElementById("loginMessage").textContent =
      "Account created successfully! Please login.";

    document.getElementById("loginMessage").className =
      "message success";

  },1200);

});


// LOGIN ACCOUNT

document.getElementById("loginForm")
.addEventListener("submit",function(e){

  e.preventDefault();

  const email = document.getElementById("loginEmail")
    .value.trim().toLowerCase();

  const password = document.getElementById("loginPassword").value;

  const users = JSON.parse(
    localStorage.getItem("gv_users") || "{}"
  );

  const message = document.getElementById("loginMessage");

  if(!users[email]){
    message.textContent = "Account not found. Please register first.";
    message.className = "message error";
    return;
  }

  if(users[email].password !== password){
    message.textContent = "Incorrect password. Try again.";
    message.className = "message error";
    return;
  }

  localStorage.setItem("gv_session",email);

  openDashboard();

});

</script>
